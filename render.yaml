# Render blueprint: a clean clone of this repo deploys the same way we did.
services:
  - type: web
    name: seat-reservation-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: seat-reservation-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'true'
      # Render's free Postgres allows far more than this; a small pool with
      # 2ms transactions sustains more throughput than a large one that
      # starves the server of backend slots.
      - key: DB_POOL_MAX
        value: '20'
      # A duplicate request waits this long for the original before being
      # told to retry, so it must exceed p99 reservation latency. Measured
      # p99 on this free instance is ~3.5s (0.1 CPU, public network), versus
      # ~1.2s on a local container -- at the 2s default, honest retries were
      # getting `request_in_flight` instead of their reservation.
      - key: IDEMPOTENCY_WAIT_MS
        value: '6000'
      # Swagger is a development convenience and stays off here. Flip to
      # 'true' in the dashboard if you want to walk someone through the API
      # against the live instance; it needs no redeploy beyond the restart.
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: LOG_LEVEL
        value: info
      - key: LOG_SAMPLE_RATE
        value: '50'
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true

databases:
  - name: seat-reservation-db
    plan: free
    # MUST match the web service's region. The `fromDatabase` connection
    # string above is Render's *internal* URL, which only resolves inside the
    # same region -- a mismatch here fails at connect time, not at deploy
    # time, so the service comes up and then every request 503s.
    region: singapore
    databaseName: seats
    user: seats
    ipAllowList: []
